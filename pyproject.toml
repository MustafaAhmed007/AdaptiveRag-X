[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rag-x"
version = "1.1.0"
description = "Production-oriented adaptive RAG platform with hybrid, graph, web, evaluation and safety layers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
providers = ["openai>=1.40", "qdrant-client>=1.10"]
reranking = ["sentence-transformers>=3.0"]

[project.scripts]
adaptive-rag = "adaptive_rag.api:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
