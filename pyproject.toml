[project]
name='adaptive-rag-x'
version='1.0.0'
description='Self-evaluating, cost-aware, hybrid and agentic RAG platform'
requires-python='>=3.11'
dependencies=['fastapi>=0.115','uvicorn[standard]>=0.30','pydantic>=2.8']
[project.optional-dependencies]
dev=['pytest>=8','ruff>=0.6','httpx>=0.27']
providers=['openai>=1.40','qdrant-client>=1.10']
[tool.pytest.ini_options]
pythonpath=['.']
testpaths=['tests']
[tool.ruff]
line-length=100
target-version='py311'
